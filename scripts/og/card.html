<!doctype html>
<html lang="en" data-theme="nostromo" data-color-scheme="dark">
  <head>
    <meta charset="utf-8" />
    <!--
      The library's own theme stylesheets, loaded from the built package.

      The four swatches below take their colour from `--nostromo-color-primary`
      under each `[data-theme]`, which is the same token the components read.
      Writing the four hex values into this file instead would produce a card
      that looks right today and drifts the first time a theme is retuned, and a
      card whose whole subject is "four themes" showing the wrong four is a poor
      way to find that out.
    -->
    <link
      rel="stylesheet"
      href="../../packages/nostromo/dist/themes/nostromo.css"
    />
    <link
      rel="stylesheet"
      href="../../packages/nostromo/dist/themes/mother.css"
    />
    <link
      rel="stylesheet"
      href="../../packages/nostromo/dist/themes/lv-426.css"
    />
    <link
      rel="stylesheet"
      href="../../packages/nostromo/dist/themes/sulaco.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1280px;
        height: 640px;
      }

      body {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 64px 80px;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: hsl(var(--nostromo-color-foreground));
        background:
          radial-gradient(
            900px 500px at 22% -15%,
            hsl(var(--nostromo-color-primary) / 0.5),
            transparent 65%
          ),
          linear-gradient(
            145deg,
            hsl(var(--nostromo-color-card)),
            hsl(var(--nostromo-color-background))
          );
      }

      /* The same grid as the documentation hero, so the card and the site it
         links to are recognisably the same thing. */
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background-image:
          repeating-linear-gradient(
            to right,
            hsl(var(--nostromo-color-border) / 0.14) 0 1px,
            transparent 1px 80px
          ),
          repeating-linear-gradient(
            to bottom,
            hsl(var(--nostromo-color-border) / 0.14) 0 1px,
            transparent 1px 80px
          );
        mask-image: radial-gradient(
          85% 95% at 20% -10%,
          black 10%,
          transparent 70%
        );
      }

      header {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .wordmark {
        width: 430px;
        height: auto;
        display: block;
      }

      .tagline {
        margin-top: 32px;
        max-width: 780px;
        font-size: 33px;
        line-height: 1.34;
        letter-spacing: -0.015em;
        color: hsl(var(--nostromo-color-foreground) / 0.92);
      }

      .sub {
        margin-top: 20px;
        font-size: 21px;
        letter-spacing: 0.01em;
        color: hsl(var(--nostromo-color-muted-foreground));
      }

      .footer {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 40px;
      }

      .themes {
        display: flex;
        gap: 34px;
      }

      .theme {
        display: flex;
        align-items: center;
        gap: 11px;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: hsl(var(--nostromo-color-muted-foreground));
      }

      .dot {
        width: 19px;
        height: 19px;
        border-radius: 999px;
        /* Each dot sits inside its own [data-theme], so this one declaration
           resolves to four different colours. */
        background: hsl(var(--nostromo-color-primary));
      }

      .pkg {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 20px;
        padding: 10px 18px;
        border-radius: 12px;
        white-space: nowrap;
        color: hsl(var(--nostromo-color-foreground) / 0.85);
        background: hsl(var(--nostromo-color-foreground) / 0.07);
        border: 1px solid hsl(var(--nostromo-color-border) / 0.22);
      }
    </style>
  </head>
  <body>
    <header>
      <img
        class="wordmark"
        src="../../docs/public/logo-white.svg"
        alt="Nostromo UI"
      />
      <p class="tagline">
        An accessible React component library with CSS-first Tailwind v4
        theming.
      </p>
      <p class="sub">
        Four themes that switch at runtime. No rebuild, no JS preset.
      </p>
    </header>

    <div class="footer">
      <div class="themes">
        <!--
          `data-theme` is on the dot, not on the row. On the row it recoloured
          the label too, and lv-426's muted foreground is a dim brown that read
          as a rendering fault rather than as a theme.
        -->
        <span class="theme"
          ><span class="dot" data-theme="nostromo"></span>Nostromo</span
        >
        <span class="theme"
          ><span class="dot" data-theme="mother"></span>Mother</span
        >
        <span class="theme"
          ><span class="dot" data-theme="lv-426"></span>LV-426</span
        >
        <span class="theme"
          ><span class="dot" data-theme="sulaco"></span>Sulaco</span
        >
      </div>
      <span class="pkg">@jarllyng/nostromo</span>
    </div>
  </body>
</html>
