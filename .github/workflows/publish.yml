name: Publish Packages to npm

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**/*.md"
      - "packages/**/package.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  # changesets/action opens the "chore: version packages" PR; without this it
  # fails with a 403 on the create call.
  pull-requests: write
  id-token: write

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # RELEASE_PAT so the release PR is authored by a real user and
          # therefore triggers CI - see the changesets step below. Falls back to
          # GITHUB_TOKEN so the workflow still runs if the secret is absent.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Node 20 bundles npm 10.8, and tokenless publishing via a Trusted
      # Publisher needs 11.5.1 or newer. Without this the registry never sees an
      # OIDC exchange, so NPM_TOKEN is silently required however npm's Trusted
      # Publisher page is configured. Kept separate from the Node version so
      # bumping Node cannot quietly undo it.
      #
      # Pinned to 11, not latest: npm 12 requires node >=22.22.2, so `npm@latest`
      # is an EBADENGINE on the Node this workflow runs. Every 11.x supports
      # node ^20.17.0, and the newest is far past 11.5.1. Raising node-version
      # above is what unlocks moving this forward.
      - name: Use an npm that supports Trusted Publishing
        run: |
          npm install -g npm@11
          INSTALLED=$(npm --version)
          echo "npm $INSTALLED"
          # Assert rather than trust the tag. The version this resolves to is
          # exactly the assumption that broke the previous attempt, and too old
          # an npm fails silently: it just never attempts the OIDC exchange.
          if [ "$(printf '%s\n11.5.1\n' "$INSTALLED" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $INSTALLED cannot do Trusted Publishing - 11.5.1 or newer is required. Either the pin above resolved to something older, or the install silently failed."
            exit 1
          fi

      # Two paths through this workflow: with pending changesets it only opens
      # the release PR, which needs no npm access at all; with none it publishes.
      - name: Check for pending changesets
        id: changesets_pending
        run: |
          if ls .changeset/*.md >/dev/null 2>&1 && \
             [ -n "$(find .changeset -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      # npm answers 404 - not 401 or 403 - when a token authenticates fine but
      # may not write the package, so the raw failure reads as "the package does
      # not exist" and sends you hunting for the wrong thing. That cost the
      # 3.1.1 release. Check write access by name here so the log says which of
      # the two it is. Only fatal on the publishing path: gating the release PR
      # on npm access stopped changesets from being versioned at all.
      - name: Verify npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HAVE_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
          PUBLISHING: ${{ steps.changesets_pending.outputs.pending == 'false' }}
        run: |
          fail() {
            if [ "$PUBLISHING" = "true" ]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::warning::$1 Not fatal here - this run only opens the release PR, but merging that PR will fail until it is fixed."
          }

          if [ "$HAVE_TOKEN" != "true" ]; then
            echo "No NPM_TOKEN set - this run relies on Trusted Publishing (OIDC)."
            exit 0
          fi

          if ! WHO=$(npm whoami 2>&1); then
            echo "npm said: $WHO"
            fail "npm rejected NPM_TOKEN outright - it is missing or expired. Regenerate it at https://www.npmjs.com/settings/~/tokens and update the NPM_TOKEN secret."
            exit 0
          fi
          echo "Authenticated to npm as $WHO"

          # read-write on the package itself is what publishing actually needs.
          # A read-only token, or one scoped to other packages, passes whoami and
          # then 404s on the PUT.
          ACCESS=$(npm access list packages @jarllyng --json 2>&1 || true)
          case "$ACCESS" in
            *'"@jarllyng/nostromo"'*'read-write'*) echo "Token has read-write on @jarllyng/nostromo." ;;
            *'"@jarllyng/nostromo"'*)
              echo "npm reported: $ACCESS"
              fail "NPM_TOKEN can read @jarllyng/nostromo but not write it. Open the token at https://www.npmjs.com/settings/~/tokens and set Permissions to Read and write." ;;
            *)
              echo "npm reported: $ACCESS"
              echo "::warning::Could not confirm NPM_TOKEN's access to @jarllyng/nostromo. If the publish fails with a 404, that is this - the token does not cover the package." ;;
          esac

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          # Build nostromo package first
          cd packages/nostromo
          pnpm build
          cd ../..
          # Reinstall to ensure workspace links are correct
          pnpm install --frozen-lockfile
          # Then build all packages
          pnpm build

      - name: Run tests
        run: pnpm test:run

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # Not `changeset publish`: it sniffs the workspace, finds pnpm, and
          # runs `pnpm publish`, which cannot do OIDC on pnpm 9. See
          # scripts/publish-package.mjs.
          publish: pnpm release
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
          setupGitUser: true
        env:
          # Must be RELEASE_PAT, not GITHUB_TOKEN. GitHub deliberately does not
          # fire workflows for events caused by GITHUB_TOKEN, so a release PR it
          # opens never gets a CI run - and with required status checks on main
          # that PR can then never be merged. A PAT is an ordinary user, so its
          # PR triggers CI normally.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
