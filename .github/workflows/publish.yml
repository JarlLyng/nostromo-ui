name: Publish Packages to npm

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**/*.md"
      - "packages/**/package.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  # changesets/action opens the "chore: version packages" PR; without this it
  # fails with a 403 on the create call.
  pull-requests: write
  id-token: write

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # RELEASE_PAT so the release PR is authored by a real user and
          # therefore triggers CI - see the changesets step below. Falls back to
          # GITHUB_TOKEN so the workflow still runs if the secret is absent.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          # Build nostromo package first
          cd packages/nostromo
          pnpm build
          cd ../..
          # Reinstall to ensure workspace links are correct
          pnpm install --frozen-lockfile
          # Then build all packages
          pnpm build

      - name: Run tests
        run: pnpm test:run

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
          setupGitUser: true
        env:
          # Must be RELEASE_PAT, not GITHUB_TOKEN. GitHub deliberately does not
          # fire workflows for events caused by GITHUB_TOKEN, so a release PR it
          # opens never gets a CI run - and with required status checks on main
          # that PR can then never be merged. A PAT is an ordinary user, so its
          # PR triggers CI normally.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
