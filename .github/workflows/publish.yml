name: Publish Packages to npm

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**/*.md"
      - "packages/**/package.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  # changesets/action opens the "chore: version packages" PR; without this it
  # fails with a 403 on the create call.
  pull-requests: write
  id-token: write

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # RELEASE_PAT so the release PR is authored by a real user and
          # therefore triggers CI - see the changesets step below. Falls back to
          # GITHUB_TOKEN so the workflow still runs if the secret is absent.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      # Two paths through this workflow: with pending changesets it only opens
      # the release PR, which needs no npm access at all; with none it publishes.
      - name: Check for pending changesets
        id: changesets_pending
        run: |
          if ls .changeset/*.md >/dev/null 2>&1 && \
             [ -n "$(find .changeset -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      # Checked early because npm answers 404, not 401, on a publish with a bad
      # token - so the real error points at a missing package instead of the
      # credentials. Only fatal on the publishing path: gating the release PR on
      # npm access stopped changesets from being versioned at all.
      - name: Verify npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISHING: ${{ steps.changesets_pending.outputs.pending == 'false' }}
        run: |
          if WHO=$(npm whoami 2>&1); then
            echo "Authenticated to npm as $WHO"
          elif [ "$PUBLISHING" = "true" ]; then
            echo "npm said: $WHO"
            echo "::error::npm rejected NPM_TOKEN, and this run would publish. Check https://www.npmjs.com/settings/~/tokens - the token must not be expired, and needs read-and-write on the whole @jarllyng scope. A granular token limited to selected packages cannot create a package that does not exist yet."
            exit 1
          else
            echo "npm said: $WHO"
            echo "::warning::npm rejected NPM_TOKEN. Not fatal here - there are pending changesets, so this run only opens the release PR. Merging that PR is what publishes, and it will fail unless the token is fixed first."
          fi

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          # Build nostromo package first
          cd packages/nostromo
          pnpm build
          cd ../..
          # Reinstall to ensure workspace links are correct
          pnpm install --frozen-lockfile
          # Then build all packages
          pnpm build

      - name: Run tests
        run: pnpm test:run

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
          setupGitUser: true
        env:
          # Must be RELEASE_PAT, not GITHUB_TOKEN. GitHub deliberately does not
          # fire workflows for events caused by GITHUB_TOKEN, so a release PR it
          # opens never gets a CI run - and with required status checks on main
          # that PR can then never be merged. A PAT is an ordinary user, so its
          # PR triggers CI normally.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
