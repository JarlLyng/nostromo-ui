name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Prevent concurrent CI runs to avoid conflicts and save resources
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One place to change the Node version. Seven jobs here each pinned "20"
# independently, which is how the repo ended up a full LTS line behind: Node 20
# left maintenance in April 2026. Referencing a workflow-level env means the next
# bump is one line, and no job can be forgotten.
#
# 24, not 22: Node 24 bundles npm 11.17, which already clears the 11.5.1 floor
# that Trusted Publishing needs - so publish.yml installs no npm of its own.
env:
  NODE_VERSION: "24"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # eslint runs with --max-warnings=0, so its exit code is the gate. The
      # previous version swallowed it and grepped stdout for an emoji-prefixed
      # count, which silently stopped working if the formatter changed.
      - name: Run linter
        run: pnpm lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: |
          pnpm type-check 2>&1 | tee typecheck-output.txt
          TYPE_CHECK_EXIT=${PIPESTATUS[0]}
          if [ $TYPE_CHECK_EXIT -ne 0 ]; then
            echo "❌ Type check failed"
            exit 1
          fi
          echo "✅ Type check passed"

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-error-logs
          path: typecheck-output.txt
          if-no-files-found: ignore
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        timeout-minutes: 10
        run: |
          cd packages/nostromo
          pnpm test:coverage 2>&1 | tee ../../test-output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          if [ $TEST_EXIT -ne 0 ]; then
            echo "❌ Tests failed or coverage below threshold"
            exit 1
          fi
          echo "✅ All tests passed with coverage above threshold"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            packages/nostromo/coverage/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-error-logs
          path: test-output.txt
          if-no-files-found: ignore
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        timeout-minutes: 15
        run: |
          # Build nostromo package first to ensure workspace dependencies are available
          echo "Building @jarllyng/nostromo package first..."
          cd packages/nostromo
          pnpm build
          cd ../..
          # Reinstall to ensure workspace links are correct after build
          echo "Reinstalling to update workspace links..."
          pnpm install --frozen-lockfile
          # Then build all packages (turbo will handle dependencies)
          echo "Building all packages..."
          pnpm build 2>&1 | tee build-output.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ Build failed"
            exit 1
          fi
          echo "✅ Build succeeded"

      - name: Check bundle sizes
        run: |
          cd packages/nostromo
          pnpm size 2>&1 | tee size-output.txt
          SIZE_EXIT=${PIPESTATUS[0]}
          if [ $SIZE_EXIT -ne 0 ]; then
            # Not necessarily over budget: size-limit exits non-zero when it
            # crashes too, and reporting that as "exceeds limits" sent me looking
            # at bundle sizes when the tool had failed to start.
            echo "❌ Bundle size check failed - see output above (over budget, or size-limit itself errored)"
            exit 1
          fi
          echo "✅ Bundle sizes within limits"

      # Deliberately part of `build` rather than a job of its own. It needs dist,
      # which this job has just produced - and `build` is already a required
      # check, so the examples are gated from the first run instead of waiting on
      # a branch-protection change nobody would remember to make.
      - name: Type-check the docs examples
        run: pnpm validate:docs-examples

      # The other half: compiling is not running. These mount every example
      # through LiveCode's real transform and scope in jsdom, which is what
      # catches the SyntaxError and ReferenceError class reported from the live
      # site. Here rather than in the `test` job because that one only runs the
      # library's own coverage, and here rather than in a job of its own because
      # `build` is already required and already has the dist these resolve
      # against.
      - name: Render the docs examples
        timeout-minutes: 10
        run: pnpm --filter nostromo-ui-docs test:run

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-logs
          path: |
            build-output.txt
            packages/nostromo/size-output.txt
          if-no-files-found: ignore
          retention-days: 7

  accessibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run accessibility tests
        timeout-minutes: 10
        run: |
          cd packages/nostromo
          pnpm test:a11y 2>&1 | tee a11y-output.txt
          A11Y_EXIT=${PIPESTATUS[0]}
          if [ $A11Y_EXIT -ne 0 ]; then
            echo "❌ Accessibility tests failed"
            exit 1
          fi
          echo "✅ Accessibility tests passed"
        id: a11y

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-error-logs
          path: packages/nostromo/a11y-output.txt
          if-no-files-found: ignore
          retention-days: 7

  # Consumes the built package the way a real project does. The library's own
  # suite runs against src in jsdom and stayed green through a total CSS failure
  # and an unconditionally-throwing Button prop; this job is what catches that
  # class of bug.
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run consumer smoke tests
        timeout-minutes: 10
        # turbo, not pnpm --filter: the test:run task declares dependsOn ^build,
        # so this builds @jarllyng/nostromo first. Without that there is no dist
        # for the smoke app to resolve through its exports map.
        run: pnpm turbo run test:run --filter=nostromo-ui-smoke

      - name: Type-check the consumer app
        run: pnpm --filter nostromo-ui-smoke run type-check

  # The same consumer check on the oldest Node that packages/nostromo promises in
  # `engines.node`. That floor is real - the built artifact loads and mounts on
  # 20.20.2 - but nothing tested it once CI moved off Node 20, and an untested
  # promise is the kind that rots quietly.
  #
  # A separate job rather than a matrix on `smoke` above, deliberately. A matrix
  # renames the check to "smoke (20)" / "smoke (24)", and branch protection
  # requires a context named exactly `smoke` - so adding one silently blocks every
  # future pull request on a check that can no longer report. Found that the hard
  # way on this branch.
  #
  # 20 is not a development target: it left maintenance in April 2026 and the
  # toolchain floor is 22.22. If a devDependency bump breaks this job, that is the
  # signal to raise the published floor in a major - a decision worth being forced
  # to make rather than hearing about from a consumer.
  smoke-node20:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run consumer smoke tests
        timeout-minutes: 10
        run: pnpm turbo run test:run --filter=nostromo-ui-smoke

  # Browser tests, for the things jsdom cannot answer: layout, pointer drags, and
  # whether the shipped stylesheet actually applies. The unit suite runs in jsdom,
  # which has no layout engine, no cascade for stylesheets it did not parse, no
  # pointer physics and no :focus-visible - so several components carry a comment
  # saying a behaviour is untested. This job is where those get tested.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keyed on the resolved Playwright version, so a browser bump invalidates
      # the cache and anything else reuses it. The two browsers are ~170MB.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: e2e

      - name: Restore the browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install the browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit
        working-directory: e2e

      # --with-deps installs system libraries as well as browsers, and those are
      # not in the cache, so they have to go on even when the browsers were
      # restored.
      - name: Install the browsers' system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit
        working-directory: e2e

      - name: Run browser tests
        timeout-minutes: 15
        # turbo, not pnpm --filter: the test:e2e task depends on this package's
        # build, which depends on ^build - so the library is built and the app
        # resolves through its exports map into dist, the same as a consumer.
        run: pnpm turbo run test:e2e --filter=nostromo-ui-e2e

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Type-check the fixtures
        run: pnpm turbo run type-check --filter=nostromo-ui-e2e

  # Installs the packed tarball into a throwaway project for each supported React
  # version. peerDependencies shipped as an exact pin once, which made
  # `npm install` fail with ERESOLVE for anyone not on that precise version -
  # and nothing in the workspace could see it, because pnpm overrides pin the
  # same version locally.
  react-compat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the library
        run: pnpm --filter @jarllyng/nostromo run build

      - name: Install and render against each supported React version
        timeout-minutes: 10
        run: pnpm verify:react-compat
