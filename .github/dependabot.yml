version: 2
updates:
  # The whole pnpm workspace, from the root.
  #
  # One npm entry, not one per package. Dependabot reads pnpm-workspace.yaml and
  # updates every package in the workspace from here, lockfile included: a single
  # grouped PR has bumped `vite` in e2e/package.json, `@next/mdx` in
  # docs/package.json, `@types/node` in four package.json files and
  # pnpm-lock.yaml, all at once.
  #
  # There used to be extra entries for /docs and /e2e, and every PR they opened
  # was dead on arrival. A directory entry edits the package.json in that
  # directory and nothing else, and in a pnpm workspace the lockfile lives at the
  # root, outside it - so CI failed at the first step with
  # ERR_PNPM_OUTDATED_LOCKFILE every single time. Four such PRs were open at once
  # (#217, #226, #227, #234) against two that came from here and passed.
  #
  # They were also quietly overriding the policy below: the /e2e entry carried no
  # major-version ignores, so it offered TypeScript 7 and @vitejs/plugin-react 6
  # to one package of a workspace the root entry deliberately holds at 5 and 5.
  #
  # So: do not add a per-directory npm entry here. If a package's dependencies are
  # not being updated, the root entry is the thing to fix.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # 5, not 3. This entry now carries the whole workspace on its own, where the
    # three npm entries it replaced had 3 + 2 + 2 between them. The groups below
    # keep minor and patch updates down to two PRs; the rest of the budget is for
    # majors, which arrive one PR each.
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    versioning-strategy: increase
    # Group updates to reduce PR noise
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    # Ignore major version updates for critical packages
    ignore:
      # React is pinned exactly via pnpm.overrides in the root package.json -
      # the workspace deliberately develops against one version while the
      # published peer range stays ^18.2 || ^19 (verified by the react-compat
      # CI job). Dependabot cannot bump a dependency that overrides pin: it
      # half-updates the lockfile's overrides section and every install after
      # that fails with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. Ignore entirely; the
      # pin moves by editing the overrides, not by dependency PR.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      # Ignore major updates for TypeScript (breaking changes)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react 6 declares `vite: ^8.0.0` as a peer, plus the new
      # @rolldown/plugin-babel and babel-plugin-react-compiler. Nothing here
      # depends on vite directly - vitest brings it, and vitest 4.1 brings 7.3 -
      # so taking the major would leave an unmet peer and a rolldown toolchain
      # nothing else in the repo uses. Revisit when vitest ships Vite 8; the
      # minor and patch stream is unaffected by this entry.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # jsdom 30 declares `^22.22.2 || ^24.15.0 || >=26.0.0` - it drops Node 20,
      # where 29 still supports ^20.19.0. That is not a conservative declaration:
      # on Node 20 it dies in undici's CacheStorage before a single test runs.
      # test-app uses jsdom, and the smoke-node20 job runs it on Node 20 to keep
      # the published `engines.node: ">=20.0.0"` honest, so 29 is the ceiling
      # until that promise changes. Minors and patches still come through.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      # Next and Nextra majors need a coordinated migration of the docs site, not
      # a dependency PR. These three moved here from the /docs entry when it was
      # removed; without them, deleting that entry would have quietly started
      # offering Next 17.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nextra"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nextra-theme-docs"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
