version: 2
updates:
  # Root package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Note: Dependabot may not always update pnpm-lock.yaml correctly in monorepos.
    # If CI fails with ERR_PNPM_OUTDATED_LOCKFILE, manually update lockfile:
    # git checkout <pr-branch> && pnpm install && git commit -am "chore: update pnpm-lock.yaml"
    versioning-strategy: increase
    # Group updates to reduce PR noise
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    # Ignore major version updates for critical packages
    ignore:
      # React is pinned exactly via pnpm.overrides in the root package.json -
      # the workspace deliberately develops against one version while the
      # published peer range stays ^18.2 || ^19 (verified by the react-compat
      # CI job). Dependabot cannot bump a dependency that overrides pin: it
      # half-updates the lockfile's overrides section and every install after
      # that fails with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. Ignore entirely; the
      # pin moves by editing the overrides, not by dependency PR.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      # Ignore major updates for TypeScript (breaking changes)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react 6 declares `vite: ^8.0.0` as a peer, plus the new
      # @rolldown/plugin-babel and babel-plugin-react-compiler. Nothing here
      # depends on vite directly - vitest brings it, and vitest 4.1 brings 7.3 -
      # so taking the major would leave an unmet peer and a rolldown toolchain
      # nothing else in the repo uses. Revisit when vitest ships Vite 8; the
      # minor and patch stream is unaffected by this entry.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # jsdom 30 declares `^22.22.2 || ^24.15.0 || >=26.0.0` - it drops Node 20,
      # where 29 still supports ^20.19.0. That is not a conservative declaration:
      # on Node 20 it dies in undici's CacheStorage before a single test runs.
      # test-app uses jsdom, and the smoke-node20 job runs it on Node 20 to keep
      # the published `engines.node: ">=20.0.0"` honest, so 29 is the ceiling
      # until that promise changes. Minors and patches still come through.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]

  # Browser tests
  #
  # Covered because the value of that suite depends on the browser versions, and
  # those arrive with @playwright/test. A Playwright left to go stale means
  # Chromium and WebKit go stale with it, and the suite quietly stops being a test
  # of what people run.
  #
  # test-app is deliberately not listed here and never has been. Its devDeps do
  # not decide what is being tested, only how it is asserted.
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "testing"
      - "automated"
    versioning-strategy: increase
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # Pinned via root pnpm.overrides - see the note on the root entry.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"

  # Docs package
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docs"
      - "automated"
    versioning-strategy: increase
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      # Pinned via root pnpm.overrides - see the note on the root entry.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Ignore major updates for Next.js and Nextra (require coordinated migration)
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nextra"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nextra-theme-docs"
        update-types: ["version-update:semver-major"]
      # Same ceiling as the root entry: jsdom 30 drops Node 20, and docs must stay
      # installable alongside test-app, which is pinned below it by smoke-node20.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
